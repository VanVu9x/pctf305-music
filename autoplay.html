<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhạc nền - Phòng Chính trị Sư đoàn 305</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
    }
  </style>
</head>
<body>
  <audio id="bgm" autoplay loop playsinline>
    <source src="https://vanvu9x.github.io/pctf305-music/intro.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("bgm");
    audio.volume = 1.0;

    // Cố gắng tự động phát sau khi tải trang
    window.addEventListener("load", () => {
      const tryPlay = () => {
        audio.play().then(() => {
          console.log("🎵 Phát nhạc thành công!");
        }).catch(() => {
          console.log("⚠️ Trình duyệt chặn autoplay. Thử lại...");
          setTimeout(tryPlay, 1500);
        });
      };
      tryPlay();
    });
  </script>
</body>
</html>
