<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhạc nền - Phòng Chính trị Sư đoàn 305</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #1e5631, #a4de02);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    button {
      background-color: #ffffff;
      border: none;
      color: #1e5631;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #a4de02;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h2>🎵 Nhạc nền – Phòng Chính trị Sư đoàn 305 🎵</h2>

  <button id="btnPlay">▶️ Bắt đầu phát nhạc</button>

  <audio id="bgm" src="https://vanvu9x.github.io/pctf305-music/intro.mp3" loop></audio>

  <script>
    const btn = document.getElementById('btnPlay');
    const audio = document.getElementById('bgm');

    // Tự phát khi tải trang nếu trình duyệt cho phép
    window.addEventListener('load', () => {
      audio.muted = true;
      audio.play().then(() => {
        audio.muted = false;
        console.log("✅ Nhạc tự động phát thành công!");
      }).catch(() => {
        console.log("⚠️ Trình duyệt chặn autoplay, cần bấm nút.");
      });
    });

    // Khi người dùng nhấn nút
    btn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btn.textContent = "⏸️ Tạm dừng nhạc";
      } else {
        audio.pause();
        btn.textContent = "▶️ Bắt đầu phát nhạc";
      }
    });
  </script>
</body>
</html>
