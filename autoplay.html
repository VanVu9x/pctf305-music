<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhạc nền - Phòng Chính trị Sư đoàn 305</title>
  <style>
    body {
      margin: 0;
      background: #0b3d0b;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    h2 {
      margin-bottom: 20px;
      color: #f5df75;
      text-shadow: 1px 1px 3px #000;
    }
    #btnPlay {
      background: #f5df75;
      color: #0b3d0b;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    #btnPlay:hover {
      background: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h2>🎶 Nhạc nền - Phòng Chính trị Sư đoàn 305</h2>

  <button id="btnPlay">▶️ Bắt đầu phát nhạc</button>

  <audio id="bgm" src="intro.MP3" loop></audio>

  <script>
    const btn = document.getElementById('btnPlay');
    const audio = document.getElementById('bgm');

    window.addEventListener('load', () => {
      audio.muted = true;
      audio.play().then(() => {
        audio.muted = false;
        console.log("Autoplay thành công!");
      }).catch(() => {
        console.log("Trình duyệt chặn autoplay, cần bấm nút.");
      });
    });

    btn.addEventListener('click', () => {
      audio.muted = false;
      audio.play();
      btn.textContent = "⏸ Tạm dừng nhạc";
      btn.removeEventListener('click', arguments.callee);

      btn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          btn.textContent = "⏸ Tạm dừng nhạc";
        } else {
          audio.pause();
          btn.textContent = "▶️ Phát nhạc";
        }
      });
    });
  </script>

</body>
</html>
