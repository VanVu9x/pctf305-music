<script>
const audio = document.getElementById('bgm');

window.addEventListener('load', () => {
  audio.play().then(() => {
    console.log("Tự động phát thành công!");
  }).catch(() => {
    console.log("Trình duyệt chặn autoplay — bật bằng thao tác người dùng.");
    document.body.addEventListener('click', () => {
      audio.play();
    }, { once: true });
  });
});
</script>
