<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhạc nền - Phòng Chính trị Sư đoàn 305</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
    }
    audio {
      display: none;
    }
  </style>
</head>
<body>
  <audio id="bgm" autoplay loop playsinline muted>
    <source src="https://vanvu9x.github.io/pctf305-music/intro.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bgm');

    // Khi trang tải xong
    window.addEventListener('load', () => {
      // Bắt đầu phát (tắt tiếng)
      audio.play().then(() => {
        console.log("🎵 Nhạc đang phát (ban đầu tắt tiếng)");
        // Sau 1 giây bật âm thanh lại
        setTimeout(() => {
          audio.muted = false;
          audio.volume = 1.0;
          console.log("🔊 Âm thanh đã bật!");
        }, 1000);
      }).catch(err => {
        console.log("⚠️ Trình duyệt chặn autoplay, thử lại...");
        setTimeout(() => audio.play(), 2000);
      });
    });
  </script>
</body>
</html>
